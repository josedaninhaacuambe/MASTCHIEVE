# ─────────────────────────────────────────────────────────────────────────────
# NGINX — mastchieve.co.mz (fase HTTP — antes do certbot)
# Colocar em: /etc/nginx/sites-available/mastchieve.co.mz
# Activar com: ln -s /etc/nginx/sites-available/mastchieve.co.mz /etc/nginx/sites-enabled/
#
# Propositalmente só HTTP (porta 80): quando o DNS apontar para este VPS,
# correr `certbot --nginx --redirect -d ...` (ver README/deploy/setup-vps-docker.sh)
# — o certbot deteta estes blocos, obtém os certificados, cria
# /etc/letsencrypt/options-ssl-nginx.conf, e reescreve este ficheiro sozinho
# para servir em 443 com redirect automático de 80→443. Não escrever os
# blocos SSL à mão aqui: certbot falha o `nginx -t` se as directivas
# ssl_certificate apontarem para ficheiros que ainda não existem.
# ─────────────────────────────────────────────────────────────────────────────

# ── Frontend (Next.js) — mastchieve.co.mz ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mastchieve.co.mz www.mastchieve.co.mz;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass         http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass   http://127.0.0.1:4300;
        expires      1y;
        add_header   Cache-Control "public, immutable";
    }

    # Proxy da API pelo próprio domínio principal — evita depender do
    # subdomínio api.mastchieve.co.mz (e do respectivo certificado SSL)
    # só para o browser conseguir falar com o backend sem Mixed Content.
    location /api/ {
        proxy_pass         http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location /uploads/ {
        alias /var/www/mastchieve/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    client_max_body_size 20M;
}

# ── API (NestJS) — api.mastchieve.co.mz ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.mastchieve.co.mz;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass         http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location /uploads/ {
        alias /var/www/mastchieve/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    client_max_body_size 15M;
}
